# nginx site for the Ruby site. Replace example.com with your domain, then:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ruby
#   sudo ln -s /etc/nginx/sites-available/ruby /etc/nginx/sites-enabled/ruby
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com   # adds HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # posts with a cover image can be several MB
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the real visitor address, for the editor's login rate limit. Set, not
        # appended, so a visitor cannot forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
